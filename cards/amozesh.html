<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سازنده کارت HTML</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background-color: #f0f0f0;
      direction: rtl;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
    }
    .form-box, .preview-box {
      flex: 1 1 45%;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: inherit;
    }
    textarea {
      height: 100px;
    }
    .card {
      border: 1px solid #ccc;
      border-radius: 10px;
      overflow: hidden;
      background-color: #fff;
      text-align: center;
      padding: 15px;
    }
    .card img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
    }
    .card-title {
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
    }
    .card-content {
      margin-top: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>فرم ساخت کارت HTML</h1>
  <div class="container">
    <div class="form-box">
      <label for="title">عنوان:</label>
      <input type="text" id="title" placeholder="مثال: تبریک روز دختر">

      <label for="image">نام فایل تصویر (مثال: picture-name.format):</label>
      <input type="text" id="image" placeholder="مثال: photo.jpg">

      <label for="content">محتوا:</label>
      <textarea id="content" placeholder="متن مورد نظر را وارد کنید..."></textarea>
    </div>

    <div class="preview-box">
      <h3>پیش‌نمایش:</h3>
      <div id="preview" class="card">
        <img src="" alt="تصویر شما" id="preview-img">
        <div class="card-title" id="preview-title">عنوان شما اینجا نمایش داده می‌شود</div>
        <div class="card-content" id="preview-content">محتوای شما اینجا نمایش داده می‌شود</div>
      </div>
    </div>
  </div>

  <script>
    const titleInput = document.getElementById('title');
    const imageInput = document.getElementById('image');
    const contentInput = document.getElementById('content');

    const previewTitle = document.getElementById('preview-title');
    const previewImg = document.getElementById('preview-img');
    const previewContent = document.getElementById('preview-content');

    function updatePreview() {
      previewTitle.textContent = titleInput.value || "عنوان شما اینجا نمایش داده می‌شود";
      previewImg.src = imageInput.value || "";
      previewContent.textContent = contentInput.value || "محتوای شما اینجا نمایش داده می‌شود";
    }

    titleInput.addEventListener('input', updatePreview);
    imageInput.addEventListener('input', updatePreview);
    contentInput.addEventListener('input', updatePreview);
  </script>
</body>
</html>
